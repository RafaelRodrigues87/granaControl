services:

  mysql:
    image: mysql:8.0
    container_name: mysql-loja

    environment:
      MYSQL_USER: admin
      MYSQL_PASSWORD: 123
      MYSQL_DATABASE: mydb
      MYSQL_ROOT_PASSWORD: 123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: backend-loja

    ports:
      - "8080:8080"

    environment:
      JWT_SECRET: RafaelRodriguesBezerraRamosOtacianoBezerra

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: